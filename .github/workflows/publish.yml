name: Generar y publicar las guías
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
          tinytex: true
      - uses: actions/configure-pages@v5
      - name: Generar web, PDF y ZIP
        run: python scripts/build.py
      - name: Comprobar descargas y enlaces
        run: python scripts/check.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
